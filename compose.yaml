services:
    nginx:
        image: 'nginx:alpine'
        ports:
            - '${APP_PORT:-80}:80'
        volumes:
            - './:/var/www/html'
            - './nginx.conf:/etc/nginx/conf.d/default.conf'
        depends_on:
            - laravel.test
    laravel.test:
        build:
            context: './vendor/laravel/sail/runtimes/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
                PHP_EXTENSIONS: 'fpm'
        ports:
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            SUPERVISOR_PHP_COMMAND: '/usr/sbin/php-fpm8.5 --nodaemonize --fpm-config /etc/php/8.5/fpm/php-fpm.conf'
            SUPERVISOR_PHP_USER: root
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
            - './php-fpm.conf:/etc/php/8.5/fpm/php-fpm.conf'
            - './vendor/laravel/sail/runtimes/8.5/php.ini:/etc/php/8.5/fpm/conf.d/99-sail.ini'
